<!doctype html>
<html lang="es">
<head>

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<title>{{TITLE}}</title>

<style>

:root{
--bg-main:#050505;
--bg-elevated:#111217;
--bg-soft:#191b22;
--text-main:#f8f8f8;
--text-muted:#b5b7c2;
--primary-red:#dd2d4a;
--primary-blue:#2c6dff;
--primary-brown:#7a4b2f;
--border-strong:#2d3040;
--border-soft:#242735;
--ok:#29b36a;
--warning:#f0a036;
--danger:#e5484d;
--shadow-lg:0 14px 34px rgba(0,0,0,0.4);
}

html{
background:#000;
min-height:100%;
color-scheme:dark;
}

body{
background:#000;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
margin:0;
padding:0;
min-height:100dvh;
}

.container{
max-width:1000px;
margin:auto;
padding:28px;
box-sizing:border-box;
min-height:100dvh;
padding-bottom:calc(28px + env(safe-area-inset-bottom, 0px));
}

@supports not (min-height: 100dvh){
body,
.container{
min-height:100vh;
}
}

.header{
text-align:center;
margin-bottom:20px;
}

.header .title{
font-size:28px;
font-weight:bold;
letter-spacing:1px;
}

.header .date{
font-size:14px;
color:#c19a6b;
margin-top:6px;
}

.separator{
height:4px;
background:#8b4513;
margin-bottom:30px;
}

.nav-bar{
display:flex;
justify-content:center;
gap:12px;
margin-bottom:30px;
flex-wrap:wrap;
}

.all-read-banner{
display:none;
text-align:center;
margin-bottom:14px;
font-size:14px;
color:#b9f6ca;
background:rgba(22,163,74,.08);
border:1px solid rgba(74,222,128,.5);
border-radius:999px;
padding:6px 14px;
}

.all-read-banner.visible{
display:block;
}

.nav-btn{
background:#222;
color:#fff;
border:1px solid #333;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
transition:all .3s ease;
font-size:16px;
font-weight:bold;
position:relative;
overflow:hidden;
}

.nav-btn:hover{
background:#333;
border-color:#555;
transform:translateY(-2px);
box-shadow:0 4px 12px rgba(0,0,0,.5);
}

.nav-btn.active{
background:#4caf50;
border-color:#4caf50;
color:#fff;
}

/* Color activo por sección */
.nav-btn[data-section="admin"].active{
background:#ff4444;
border-color:#ff4444;
color:#fff;
}

.nav-btn[data-section="eventos"].active{
background:#ffdd44;
border-color:#ffdd44;
color:#000;
}

.nav-btn[data-section="pastoral"].active{
background:#4caf50;
border-color:#4caf50;
color:#fff;
}

.nav-btn[data-section="formacion"].active{
background:#4da3ff;
border-color:#4da3ff;
color:#fff;
}

.nav-btn[data-section="extras"].active{
background:#8b4513;
border-color:#8b4513;
color:#f9e7d0;
}

/* Secciones ya visitadas (no activas) */
.nav-btn.visited:not(.active){
background:#181b20;
border-color:#4caf50;
color:#d1fae5;
box-shadow:0 0 0 1px rgba(74,222,128,.35);
}

.nav-btn.visited:not(.active)::after{
content:"✓";
position:absolute;
right:8px;
top:6px;
font-size:11px;
opacity:.9;
}

.content-container{
position:relative;
min-height:200px;
}

.section{
display:none;
width:100%;
}

.section.active{
display:block;
}

.card{
background:#111;
padding:20px;
margin-bottom:28px;
border-radius:6px;
border-left:5px solid;
transition:transform .3s ease,box-shadow .3s ease;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 8px 25px rgba(0,0,0,.3);
}

.admin{border-left-color:#ff4444;}
.formacion{border-left-color:#4da3ff;}
.eventos{border-left-color:#ffdd44;}
.pastoral{border-left-color:#4caf50;}
.extras{border-left-color:#8b4513;}

.admin .title{color:#ff4444;}
.formacion .title{color:#4da3ff;}
.eventos .title{color:#ffdd44;}
.pastoral .title{color:#4caf50;}
.extras .title{color:#c19a6b;}

.title{
font-size:20px;
font-weight:bold;
}

.btn{
display:inline-block;
text-decoration:none;
padding:10px 16px;
border-radius:5px;
font-weight:bold;
transition:all .3s ease;
}

.btn:hover{
transform:scale(1.05);
box-shadow:0 4px 12px rgba(0,0,0,.3);
}

.tag{
display:inline-block;
background:#1a1a1a;
padding:4px 10px;
border-radius:20px;
font-size:12px;
margin:4px 4px 0 0;
border:1px solid;
}

.footer{
text-align:center;
font-size:12px;
color:#888;
margin-top:30px;
}

.footer::before{
content:"";
display:block;
height:4px;
background:#8b4513;
margin-bottom:10px;
}

</style>

{{BLOCK_STYLES}}

</head>

<body>

<div class="container">

<div class="header">
<div class="title">{{TITLE}}</div>
<div class="date">{{DATE}}</div>
</div>

<div class="separator"></div>


<div id="all-read-banner" class="all-read-banner">
{{BANNER_MESSAGE}}
</div>

<div class="nav-bar">

{{NAV_ADMIN}}

{{NAV_EVENTOS}}

{{NAV_PASTORAL}}

{{NAV_FORMACION}}

{{NAV_EXTRAS}}

</div>


<div class="content-container">

{{SECTION_ADMIN}}

{{SECTION_EVENTOS}}

{{SECTION_PASTORAL}}

{{SECTION_FORMACION}}

{{SECTION_EXTRAS}}

</div>


<footer class="footer">
© {{YEAR}} Zona Omaha. Todos los derechos reservados.
</footer>


</div>


<script>

document.addEventListener("DOMContentLoaded",function(){

const navBtns=document.querySelectorAll(".nav-btn");
const sections=document.querySelectorAll(".section");
const allReadBanner=document.getElementById("all-read-banner");

function updateAllReadBanner(){
if(!allReadBanner)return;
const allVisited=Array.from(navBtns).every(btn=>btn.classList.contains("visited"));
 const wasVisible=allReadBanner.classList.contains("visible");
 allReadBanner.classList.toggle("visible",allVisited);
}

// Marca la sección inicial como visitada
const initialActive=document.querySelector(".nav-btn.active");
if(initialActive){
initialActive.classList.add("visited");
updateAllReadBanner();
}

navBtns.forEach(btn=>{

btn.addEventListener("click",function(){

const sectionId=this.getAttribute("data-section");

navBtns.forEach(b=>b.classList.remove("active"));
this.classList.add("active");
this.classList.add("visited");

sections.forEach(sec=>sec.classList.remove("active"));

document.getElementById(sectionId).classList.add("active");

updateAllReadBanner();

});

});

});

</script>

</body>
</html>
